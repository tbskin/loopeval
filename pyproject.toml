[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "loopeval"
version = "0.1.0"
description = "Evaluate application traces with exact checks, Jev, and a learning LLM fallback."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "LoopEval contributors" }]
keywords = ["llm", "evaluation", "evals", "jev", "ai", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0.2,<7",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6",
  "ruff>=0.8",
  "twine>=6.1",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
loopeval = "loopeval.cli:app"

[project.urls]
Documentation = "https://github.com/tbskin/loopeval#readme"
Issues = "https://github.com/tbskin/loopeval/issues"
Source = "https://github.com/tbskin/loopeval"

[tool.hatch.build.targets.wheel]
packages = ["src/loopeval"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
packages = ["loopeval"]

[tool.coverage.run]
source = ["loopeval"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
