version: 1
project: refund-assistant
checks:
  - checks
providers:
  decision:
    type: typesafe
    model: jev-1.13.0
    api_key_env: TYPESAFE_API_KEY
    timeout_seconds: 20
    input_cost_per_million: 0.042
    output_cost_per_million: 0
  fallback:
    type: openai
    model: gpt-4.1-mini
    api_key_env: OPENAI_API_KEY
    timeout_seconds: 45
escalation:
  random_audit_rate: 0.02
storage:
  directory: .loopeval
  database: loopeval.db
  cache: true
