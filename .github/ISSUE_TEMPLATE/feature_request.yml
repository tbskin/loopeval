name: Feature request
description: Propose a focused improvement to the standalone framework.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What evaluation or learning-loop problem is not handled today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest provider-independent solution you would use.
    validations:
      required: true
  - type: textarea
    id: trust
    attributes:
      label: Trust and cost impact
      description: How would this affect false positives, misses, review, privacy, or cost?
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Core scope
      options:
        - label: This fits LoopEval's provider-independent contracts and reviewed learning workflow.
          required: true
