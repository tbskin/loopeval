name: Feature request
description: Propose an improvement to LoopEval.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What evaluation or learning-loop problem is not handled today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the behavior you would use and a concrete example.
    validations:
      required: true
  - type: textarea
    id: trust
    attributes:
      label: Trust and cost impact
      description: How would this affect false positives, misses, review, privacy, or cost?
    validations:
      required: true
